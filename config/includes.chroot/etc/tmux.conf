# ChuckOS default tmux configuration
#
# Alt+Left / Alt+Right switch windows WITHOUT the tmux prefix key, so it
# behaves like Alt-Tab across your terminals. Alt+1..5 jump to a window
# directly. Prefix-based bindings (Ctrl-b c = new window, Ctrl-b , = rename,
# Ctrl-b d = detach, Ctrl-b [ = scrollback/copy mode) still work as usual.

bind -n M-Right next-window
bind -n M-Left  previous-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# The M-Left/M-Right bindings above only recognize the xterm-style escape
# sequence for Alt+arrow (e.g. ESC [ 1 ; 3 D) -- what an SSH client's own
# terminal emulator sends, which is why these work over SSH. The raw Linux
# physical console (TERM=linux) has no such modified-arrow sequence; its
# kernel keyboard driver's Meta/Alt handling just prefixes a second ESC
# onto the plain arrow key's own sequence instead (ESC ESC [ D for
# Alt+Left, ESC ESC [ C for Alt+Right) -- a different byte string tmux
# doesn't recognize as M-Left/M-Right out of the box. Teach it as an
# explicit raw sequence via user-keys so both paths work.
set -s user-keys[0] "\033\033[D"
set -s user-keys[1] "\033\033[C"
bind -n User0 previous-window
bind -n User1 next-window

# Click to switch panes/windows, drag to resize, wheel to scroll. Note this
# captures click-drag text selection too (your terminal's own copy won't
# see it) -- hold Shift while selecting to bypass tmux and use your
# terminal's native selection/copy instead.
set -g mouse on
set -g base-index 1
set -g renumber-windows on
set -g history-limit 10000

set -g status-bg colour235
set -g status-fg colour250
set -g status-left ""
set -g status-right "#[fg=colour250]%H:%M "
setw -g window-status-current-style "bg=colour24,fg=white,bold"
