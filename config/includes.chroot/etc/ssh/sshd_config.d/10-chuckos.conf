# ChuckOS: explicitly allow SSH password authentication.
#
# live-config's own 1160-openssh-server component rewrites the main
# /etc/ssh/sshd_config at every live boot to force PasswordAuthentication
# no (a sensible default for a system with a well-known default live
# password -- user/live). Since sshd reads /etc/ssh/sshd_config.d/*.conf
# via an Include near the TOP of sshd_config, and OpenSSH keeps the FIRST
# value it sees for a given directive, this file's setting wins regardless
# of what live-config does to the main file afterward.
#
# This re-opens password SSH using that well-known default password --
# acceptable for local testing, not for anything reachable on a real
# network. See MANUAL.md ("SSH access") for the actual credentials.
PasswordAuthentication yes
